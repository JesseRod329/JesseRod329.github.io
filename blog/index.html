<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jesse Rodriguez — AI Open-Source Blog</title>
  <style>
    :root{--bg:#0d1117;--card:#111822;--line:#21262d;--text:#e6edf3;--muted:#9aa4b2;--brand:#149cb8}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,Segoe UI,Arial,sans-serif}
    .wrap{max-width:860px;margin:0 auto;padding:24px}
    a{color:var(--brand);text-decoration:none} a:hover{text-decoration:underline}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .top h1{margin:0;font-size:clamp(1.4rem,2vw,2rem)}
    .sub{margin:8px 0 18px;color:var(--muted)}
    .btn{border:1px solid var(--line);padding:8px 12px;border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
    .btn:hover{border-color:var(--brand);color:var(--brand)}
    .post{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:18px;margin:14px 0}
    .meta{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
    .title{margin:.25rem 0 .45rem;font-size:1.25rem;line-height:1.35}
    .summary{color:#c6d0db}
    ul{margin:.5rem 0 .2rem 1.1rem}
    li{margin:.25rem 0}
    .links{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    .tag{border:1px solid #2d3748;border-radius:999px;padding:4px 10px;font-size:.8rem;color:#d4d8df}
    .empty{border:1px dashed var(--line);border-radius:14px;padding:20px;color:var(--muted)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <h1>Jesse’s AI Open-Source Blog</h1>
      <a class="btn" href="/">← Home</a>
    </div>
    <p class="sub">Simple daily updates from Reddit + X. No fluff. Just what dropped and why it matters.</p>
    <div id="posts"></div>
  </main>

  <script>
    const postsEl = document.getElementById('posts');
    const fmt = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});

    function render(posts){
      if(!posts || !posts.length){
        postsEl.innerHTML = '<div class="empty">No posts yet. Say <b>update the blog</b> and I\'ll publish one.</div>';
        return;
      }
      postsEl.innerHTML = posts.map(p => `
        <article class="post">
          <div class="meta">${fmt(p.date)}</div>
          <h2 class="title">${p.title}</h2>
          <p class="summary">${p.summary || ''}</p>
          <ul>${(p.bullets||[]).map(b=>`<li>${b}</li>`).join('')}</ul>
          <div class="links">${(p.links||[]).map(l=>`<a class="tag" target="_blank" rel="noopener" href="${l.url}">${l.label}</a>`).join('')}</div>
        </article>`).join('');
    }

    fetch('./posts.json?ts='+Date.now())
      .then(r => r.json())
      .then(data => render(data.posts || []))
      .catch(() => postsEl.innerHTML = '<div class="empty">Could not load posts.json</div>');
  </script>
</body>
</html>
